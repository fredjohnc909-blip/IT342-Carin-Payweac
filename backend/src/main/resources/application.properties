# Server
server.port=8080

# MySQL (XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/payweacdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
jwt.secret=PayWEACSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLongForHS256
jwt.access-token-expiration=86400000
jwt.refresh-token-expiration=604800000
