# Optional local secrets (password) — copy from application-local.properties.example
spring.config.import=optional:file:./application-local.properties

# Server
server.port=8080

# Neon PostgreSQL (pooler)
spring.datasource.url=jdbc:postgresql://ep-restless-smoke-an8zs3xi-pooler.c-6.us-east-1.aws.neon.tech:5432/neondb?sslmode=require&channelBinding=require
spring.datasource.username=neondb_owner

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT
jwt.secret=PayWEACSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLongForHS256
jwt.access-token-expiration=86400000
jwt.refresh-token-expiration=604800000
